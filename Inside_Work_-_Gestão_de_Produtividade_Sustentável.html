                if (this.currentUser) {

                this.render();

                return this.db.Colaborador.find(c => c.Colaborador_ID === Number(id));

            // RF03: Monitoramento leve em segundo plano (sem ler teclas digitadas - RF07)
            initBackgroundDaemonRF03() {
                let lock = false;
                window.addEventListener("mousemove", () => {
                    if (!lock) {
                        this.sessionEventsCount++;
                        const el = document.getElementById("rf03-counter");
                        if (el) el.textContent = this.sessionEventsCount;
                        lock = true;
                        setTimeout(() => { lock = false; }, 200);
                    }
                });
                window.addEventListener("keydown", () => {
                    // RF07 LGPD: Não acessamos event.key, apenas incrementamos contador bruto de atividade
                    this.sessionEventsCount++;
                    const el = document.getElementById("rf03-counter");
                    if (el) el.textContent = this.sessionEventsCount;
                });
            }

                const user = this.getColabById(colabId);
                if (!user) return;
                this.currentUser = user;
                // Restaura a conversa apenas na interface a cada login/troca de perfil, sem apagar do banco de dados

                } else if (user.Perfil === "gestor") {
                    this.activeTab = "GES_DASHBOARD";
                } else if (user.Perfil === "diretoria") {

                this.notify(`Bem-vindo(a), ${user.Nome} (${user.Cargo})!`, "success");

            normalizarTexto(txt) {
                return String(txt || "")
                    .toLowerCase()
                    .normalize("NFD")
                    .replace(/[\u0300-\u036f]/g, "")
                    .trim();
            }

            /**
             * Chamada à API Gemini com Exponential Backoff injetando toda a memória relacional (db)
             */
            async consultarGeminiComMemoria(perguntaUsuario, usuarioLogado) {
                const apiKey = "";
                const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;

                const contextoMemoria = {
                    usuarioLogado: {
                        Colaborador_ID: usuarioLogado.Colaborador_ID,
                        Nome: usuarioLogado.Nome,
                        Cargo: usuarioLogado.Cargo,
                        Perfil: usuarioLogado.Perfil,
                        SPS_Score: usuarioLogado.SPS_Score,
                        horasPontoDia: usuarioLogado.horasPontoDia,
                        minContinuosTecladoMouse: usuarioLogado.minContinuos,
                        pausaDiariaMin: usuarioLogado.pausaDiariaMin,
                        entregasJiraPct: usuarioLogado.entregasJiraPct
                    },
                    eventosSessaoRF03: this.sessionEventsCount,
                    cardsJiraTrello: this.trelloCards,
                    bancoDeDadosRelacional: {
                        Colaborador: this.db.Colaborador,
                        Ponto: this.db.Ponto,
                        Alerta_Saude: this.db.Alerta_Saude,
                        Folga: this.db.Folga
                    }
                };

                const systemPrompt = `Você é o Assistente Inteligente oficial do sistema corporativo InsideWork (Sistema de Gestão de Produtividade Sustentável).
Você está conversando com ${usuarioLogado.Nome} (Cargo: ${usuarioLogado.Cargo}, Perfil: ${usuarioLogado.Perfil}).

Abaixo está o estado EXATO e em tempo real da memória do banco de dados do sistema (JSON):
${JSON.stringify(contextoMemoria, null, 2)}

REGRAS DE NEGÓCIO DO INSIDEWORK PARA SUA ANÁLISE:
- RF03 e RF07 (LGPD): O sistema monitora apenas a quantidade de eventos e o tempo contínuo de teclado/mouse, NUNCA o conteúdo digitado.
- RNF02: Senhas são protegidas com hash BCrypt ($2b$12$KIX/HashBCryptSimuladoRNF02).
- RF05 (Cálculo do SPS): Combina Taxa de Entregas Jira/Trello (40%), cumprimento da jornada de 8h no Ponto Eletrônico (35%) e Ergonomia NR-17 / respeito às pausas (25%).
  * Faixa Verde (SPS >= 80): Saudável e Sustentável.
  * Faixa Amarela (70 <= SPS < 80): Atenção Ergonômica (limite NR-17 é de no máximo 60 min contínuos sem pausa).
  * Faixa Vermelha (SPS < 70): Risco Crítico de Sobrecarga / Burnout (exige redistribuição de 30% dos cards no Jira/Trello, suspensão de horas extras e prioridade de folga).
- RN02 e NR-17: Recomenda-se pausa ativa de 10 minutos a cada 50-60 minutos contínuos de digitação/mouse e pelo menos 40 min de pausa diária total.

INSTRUÇÕES OBRIGATÓRIAS DE RESPOSTA:
1. Responda em português do Brasil de forma 100% COERENTE, DIRETA, NATURAL e ESPECÍFICA ao que o usuário perguntou.
2. NÃO despeje relatórios genéricos se o usuário fez uma pergunta simples ou específica. Responda exatamente à dúvida dele citando os números reais da memória quando pertinente.
3. Use formatação limpa com **negrito** para destacar nomes, notas de SPS, datas ou métricas importantes.`;

                const ultimasInteracoes = (this.chatSessaoAtual || [])
                    .slice(-4)
                    .flatMap(h => [
                        { role: "user", parts: [{ text: h.Pergunta_Usuario }] },
                        { role: "model", parts: [{ text: h.Resposta_IA }] }
                    ]);

                const payload = {
                    contents: [
                        ...ultimasInteracoes,
                        { role: "user", parts: [{ text: perguntaUsuario }] }
                    ],
                    systemInstruction: {
                        parts: [{ text: systemPrompt }]
                    }
                };

                const delays = [1000, 2000, 4000];
                for (let attempt = 0; attempt <= delays.length; attempt++) {
                    try {
                        const response = await fetch(apiUrl, {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify(payload)
                        });

                        if (response.ok) {
                            const result = await response.json();
                            const text = result?.candidates?.[0]?.content?.parts?.[0]?.text;
                            if (text && text.trim()) {
                                return text.trim();
                            }
                        }
                    } catch (err) {
                        // Tenta novamente silenciosamente conforme backoff
                    }
                    if (attempt < delays.length) {
                        await new Promise(r => setTimeout(r, delays[attempt]));
                    }
                }
                return null;
            }

            /**
             * Motor Interpretativo Local Inteligente (responde de forma direta e cirúrgica à pergunta feita

                    if (colabsCitados.length === 1 || u.Perfil === "colaborador") {
                        const card = cards.find(t => t.respId === alvo.Colaborador_ID);
                        return `Sobre as entregas e matriz de esforço de ${nomeAlvo} na memória:\n\n` +
                            `• **Card Principal atribuído:** ${card ? `**${card.id} — ${card.titulo}** (Status: *${card.status}* | Nível de Esforço: *${card.esforco}*)` : "Demandas gerais da Sprint"}\n` +
                            `• **Taxa de Entrega no Jira/Trello:** **${alvo.entregasJiraPct}%** (representa 40% da nota do SPS)\n` +
                            `• **Cruzamento com Esforço Físico:** Jornada de **${alvo.horasPontoDia}h/dia** com **${alvo.minContinuos} min** de periféricos contínuos → **SPS ${Number(alvo.SPS_Score).toFixed(2)} pts**.`;
                    }

                    return `Aqui está a **Matriz de Esforço x Jira/Trello** atual da equipe na memória:\n\n` +
                        cards.map(card => {
                            const c = this.getColabById(card.respId);
                            return `• **${card.id} (${card.titulo})** — Responsável: **${c ? c.Nome : ""}**\n` +
                                `  ↳ Taxa de Entrega: **${c ? c.entregasJiraPct : 0}%** | Esforço: **${card.esforco}** | Impacto: **${card.impacto}** | SPS: **${c ? Number(c.SPS_Score).toFixed(2) : "-"} pts**`;
                        }).join("\n\n");
                }

                // RESPOSTA J: Análise de um Colaborador Específico citado ou do próprio SPS
                if (colabsCitados.length === 1 || perguntaSPS || u.Perfil === "colaborador") {
                    const parecer = obterParecerFixoSPS(alvo.SPS_Score);
                    const alertasColab = alertas.filter(a => a.Colaborador_ID === alvo.Colaborador_ID && a.Status !== "Resolvido");
                    const folgasColab = folgas.filter(f => f.Colaborador_ID === alvo.Colaborador_ID);
                    const card = cards.find(t => t.respId === alvo.Colaborador_ID);

                    return `Aqui está a análise completa em tempo real de ${nomeAlvo} com base na memória do sistema:\n\n` +
                        `• **Score SPS Atual:** **${Number(alvo.SPS_Score).toFixed(2)} pts** — **${parecer.faixa}**\n` +
                        `• **Produtividade (Jira/Trello):** **${alvo.entregasJiraPct}%** de entregas concluídas ${card ? `(*${card.id}: ${card.titulo}*)` : ""}\n` +
                        `• **Jornada e Ergonomia (NR-17):** **${alvo.horasPontoDia}h/dia** no Ponto | **${alvo.minContinuos} min** contínuos de teclado/mouse | **${alvo.pausaDiariaMin} min** de pausas diárias\n` +
                        `• **Alertas Ativos/Pendentes:** **${alertasColab.length}** ${alertasColab.length > 0 ? `(${alertasColab.map(a => a.Tipo_Alerta).join("; ")})` : "(Nenhum alerta ativo)"}\n` +
                        `• **Férias/Folgas registradas:** **${folgasColab.length}** ${folgasColab.length > 0 ? `(${folgasColab.map(f => `${f.Tipo_Folga}: ${f.Status}`).join(", ")})` : "(Nenhuma solicitação)"}\n\n` +
                        `**Parecer Recomendado:** ${u.Perfil === "colaborador" && alvo.Colaborador_ID === u.Colaborador_ID ? parecer.relatorioColaborador : parecer.recomendacaoGestor}`;
                }

                // RESPOSTA K: Visão Geral Executiva / Equipe para Gestor ou Diretoria
                const operacionais = colabs.filter(c => c.Perfil === "colaborador");
                const mediaSPS = (operacionais.reduce((acc, c) => acc + Number(c.SPS_Score), 0) / (operacionais.length || 1)).toFixed(2);
                const alertasAtivos = alertas.filter(a => a.Status !== "Resolvido");
                const folgasPendentes = folgas.filter(f => f.Status === "Pendente");

                return `Analisando sua pergunta com base no panorama atual da memória do **InsideWork**:\n\n` +
                    `• **Média de SPS da Equipe Operacional:** **${mediaSPS} pts**\n` +
                    operacionais.map(c => `  ↳ **${c.Nome}** (${c.Cargo}): **SPS ${Number(c.SPS_Score).toFixed(2)}** | Contínuo: ${c.minContinuos}min | Pausas: ${c.pausaDiariaMin}min | Jira: ${c.entregasJiraPct}%`).join("\n") +

                    `Se quiser detalhar alguém específico, basta perguntar pelo nome (ex: *Ana Souza*, *Lanes Silva* ou *Carlos Mendes*) ou perguntar sobre ponto, folgas, alertas ou ergonomia.`;
            }

            /**
             * Envia a pergunta digitada pelo usuário, consulta a IA / motor de memória e grava em Chat_IA_Historico
             */
            async enviarMensagemChatbot(event) {
                if (event) event.preventDefault();
                if (this.isChatLoading) return;

                const inputEl = document.getElementById("chat-free-input");
                const texto = inputEl ? inputEl.value.trim() : "";

                if (!texto) {
                    this.notify("Digite sua pergunta no campo de mensagem antes de enviar.", "warning");
                    return;
                }

                if (inputEl) inputEl.value = "";
                this.isChatLoading = true;
                this.render();

                // Mantém o scroll no final enquanto exibe o indicador de "Analisando memória..."
                const rolarParaFim = () => {
                    const feed = document.getElementById("chat-messages-feed");
                    if (feed) feed.scrollTop = feed.scrollHeight;
                };
                setTimeout(rolarParaFim, 30);

                let respostaFinal = null;
                try {
                    respostaFinal = await this.consultarGeminiComMemoria(texto, this.currentUser);
                } catch (err) {
                    respostaFinal = null;
                }

                // Se a API externa não retornar, utiliza imediatamente o interpretador contextual local
                if (!respostaFinal) {
                    respostaFinal = this.interpretarMensagemComMemoria(texto, this.currentUser);
                }

                const nextId = this.db.Chat_IA_Historico.length > 0
                    ? Math.max(...this.db.Chat_IA_Historico.map(h => h.Historico_ID)) + 1
                    : 1;

                const novoRegistroChat = {
                    Historico_ID: nextId,
                    Colaborador_ID: this.currentUser.Colaborador_ID,
                    Pergunta_Usuario: texto,
                    Resposta_IA: respostaFinal,
                    SPS_Score_Calculado: Number(this.currentUser.SPS_Score)
                };

                // Grava na tabela oficial Chat_IA_Historico do DER (persistido no banco) e na sessão visual atual
                this.db.Chat_IA_Historico.push(novoRegistroChat);
                this.chatSessaoAtual.push(novoRegistroChat);

                this.isChatLoading = false;
                this.saveDatabase();
                this.render();

                setTimeout(() => {
                    rolarParaFim();
                    const novoInput = document.getElementById("chat-free-input");
                    if (novoInput) novoInput.focus();
                }, 50);
            }

            // Formata o texto salvo em Chat_IA_Historico com suporte limpo a Markdown
            formatarRespostaChatHTML(respostaTexto) {
                const formatar = (str) => {
                    return String(str || "")
                        .replace(/&/g, "&amp;")
                        .replace(/</g, "&lt;")
                        .replace(/>/g, "&gt;")
                        .replace(/\*\*(.*?)\*\*/g, "<strong class='text-slate-900 font-bold'>$1</strong>")
                        .replace(/\*(.*?)\*/g, "<em class='text-slate-700'>$1</em>")
                        .replace(/`(.*?)`/g, "<code class='font-mono-code bg-slate-100 text-blue-800 px-1.5 py-0.5 rounded text-[11px] border border-slate-200'>$1</code>")
                        .replace(/\n/g, "<br>");
                };

                return `<div class="text-xs sm:text-sm text-slate-700 leading-relaxed space-y-1">${formatar(respostaTexto)}</div>`;
            }

            registrarPonto(e) {
                e.preventDefault();
                const data = document.getElementById("ponto-data").value;
                const entrada = document.getElementById("ponto-entrada").value;
                const saida = document.getElementById("ponto-saida").value || null;

                const nextId = this.db.Ponto.length > 0
                    ? Math.max(...this.db.Ponto.map(p => p.Ponto_ID)) + 1
                    : 1;

                this.db.Ponto.push({
                    Ponto_ID: nextId,
                    Colaborador_ID: this.currentUser.Colaborador_ID,
                    Data: data,
                    Hora_Entrada: entrada,
                    Hora_Saida: saida
                });

                this.saveDatabase();
                this.render();
                this.notify("Registro gravado na tabela Ponto e disponível na memória do Chatbot!", "success");
            }

            solicitarFolga(e) {
                e.preventDefault();
                const tipo = document.getElementById("folga-tipo").value;
                const inicio = document.getElementById("folga-inicio").value;
                const fim = document.getElementById("folga-fim").value;
                const just = document.getElementById("folga-justificativa").value.trim();

                if (!just) return;

                const nextId = this.db.Folga.length > 0
                    ? Math.max(...this.db.Folga.map(f => f.Folga_ID)) + 1
                    : 1;

                this.db.Folga.push({
                    Folga_ID: nextId,
                    Colaborador_ID: this.currentUser.Colaborador_ID,
                    Tipo_Folga: tipo,
                    Data_Inicio: inicio,
                    Data_Fim: fim,
                    Justificativa: just,
                    Status: "Pendente"
                });

                this.saveDatabase();
                this.render();
                this.notify("Solicitação de folga registrada na tabela Folga com status Pendente!", "success");

                const colab = this.getColabById(alerta.Colaborador_ID);
                if (colab && colab.SPS_Score < 75) {
                    colab.pausaDiariaMin = Math.max(40, colab.pausaDiariaMin);
                    colab.minContinuos = Math.min(55, colab.minContinuos);

                this.notify(`Alerta #${alertaId} resolvido e métricas atualizadas na memória!`, "success");

            calcularFormulaSPS(jiraPct, horasDia, minContinuos, pausaMin) {
                const notaJira = Number(jiraPct); // 0 a 100
                const desvioHoras = Math.abs(Number(horasDia) - 8.0);
                const notaJornada = Math.max(0, 100 - (desvioHoras * 18));

                const excessoContinuo = Math.max(0, Number(minContinuos) - 50);
                const bonusPausa = Math.min(20, Number(pausaMin) * 0.4);
                const notaErgonomia = Math.min(100, Math.max(0, 95 - (excessoContinuo * 0.65) + bonusPausa));

                const spsFinal = (notaJira * 0.40) + (notaJornada * 0.35) + (notaErgonomia * 0.25);
                return Number(Math.min(100, Math.max(10, spsFinal)).toFixed(2));
            }

                document.getElementById("lbl-sim-pausa").textContent = `${pausa} min`;

                colab.horasPontoDia = horas;
                colab.minContinuos = cont;

                colab.SPS_Score = novoSPS;

                // Se a simulação ultrapassou 120min contínuos, dispara alerta automático RF04 na memória

            renderFooter() {
                return `
                    <footer class="bg-white border-t border-slate-200 py-4 mt-8">
                        <div class="max-w-6xl mx-auto px-4 sm:px-6 flex flex-wrap items-center justify-between gap-2 text-xs text-slate-400">
                            <span><strong>InsideWork</strong> — Sistema de Gestão de Produtividade Sustentável (NR-17 & LGPD)</span>
                            <div class="flex items-center gap-4">
                                <span>Memória SQL: 5 Tabelas Ativas</span>
                                <button onclick="app.resetToSeed()" class="text-blue-600 hover:underline font-medium">Restaurar Seed Inicial</button>
                            </div>
                        </div>
                    </footer>
                `;
            }

            notify(message, type = "info") {
                const container = document.getElementById("toast-container");
                if (!container) return;

                const colors = {
                    success: "bg-emerald-600 text-white",
                    error: "bg-rose-600 text-white",
                    warning: "bg-amber-500 text-white",
                    info: "bg-slate-900 text-white"
                };

                const toast = document.createElement("div");
                toast.className = `pointer-events-auto px-4 py-3 rounded-xl shadow-lg text-xs font-semibold flex items-center justify-between gap-3 fade-in ${colors[type] || colors.info}`;
                toast.innerHTML = `
                    <span>${message}</span>
                    <button onclick="this.parentElement.remove()" class="opacity-80 hover:opacity-100"><i class="fa-solid fa-xmark"></i></button>
                `;
                container.appendChild(toast);

                setTimeout(() => {
                    if (toast.parentElement) toast.remove();
                }, 4000);
            }
        }

        // Inicializa a aplicação ao carregar a janela
        window.onload = function () {
            window.app = new InsideWorkSystem();
        };
    </script>
</body>
</html>
